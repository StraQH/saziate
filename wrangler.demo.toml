name = "saziate-demo"
main = ".open-next/worker.js"
compatibility_date = "2025-07-01"
compatibility_flags = ["nodejs_compat"]

assets = { directory = ".open-next/assets", binding = "ASSETS" }

[observability.logs]
enabled = true
invocation_logs = true


# CRITICAL: Isolate the Demo Database!
[[env.demo.d1_databases]]
binding = "DB"
database_name = "saziate-demo-db"
database_id = "d52c8fa6-9567-4dc2-9139-379a12f6093e"

[env.demo.vars]
NEXT_PUBLIC_APP_NAME = "Saziate Demo"
NEXT_PUBLIC_MOCK_MODE = "true"


[build]
command = "npm run build:worker"

[triggers]
crons = [
  "0 0 1 * *",  # Monthly: generate-invoices (Run on 1st of month at midnight)
  "0 0 * * *",  # Daily: process-payouts (Run every night at midnight)
  "*/5 * * * *" # Every 5 minutes: dispatch-notifications (Process email/SMS queue)
]